appId: com.anden.app
---
- runFlow:
    file: setup.yaml
- tapOn:
    id: "dashboard.compare"
- extendedWaitUntil:
    visible: "Tu comparación"
    timeout: 30000
# Las alternativas que quedaron fuera por datos incompletos se informan en el
# resumen, antes de bajar a la tarjeta del plan.
- runFlow:
    when:
      visible: "alternativas pendientes"
    commands:
      - assertVisible: "alternativas pendientes"
# El baseline se valida antes de cambiar de pestaña: al elegir B o C la tarjeta
# deja de decir "Plan de ejemplo".
- scrollUntilVisible:
    element:
      text: "Ejemplo"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Plan de ejemplo"
    direction: DOWN
- assertVisible: "Plan de ejemplo"
# Volver al selector para probar las alternativas (solo si existen).
- scrollUntilVisible:
    element:
      text: "Ejemplo"
    direction: UP
- runFlow:
    when:
      visible: "Alternativa B"
    commands:
      - tapOn: "Alternativa B"
      - assertVisible: "Alternativa B"
- runFlow:
    when:
      visible: "Alternativa C"
    commands:
      - tapOn: "Alternativa C"
      - assertVisible: "Alternativa C"
- scrollUntilVisible:
    element:
      id: "comparison.simulate"
    direction: DOWN
- assertVisible:
    id: "comparison.simulate"
- assertVisible: "Probar un cambio"
