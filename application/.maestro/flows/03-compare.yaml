appId: host.exp.exponent
---
- runFlow:
    file: setup.yaml
- scrollUntilVisible:
    element:
      id: "dashboard.compare"
    direction: DOWN
- tapOn:
    id: "dashboard.compare"
- scrollUntilVisible:
    element:
      text: "Rotación actual"
    direction: DOWN
- assertVisible: "Rotación actual"
- scrollUntilVisible:
    element:
      text: "Alternativa B"
    direction: DOWN
- assertVisible: "Alternativa B"
- scrollUntilVisible:
    element:
      text: "Alternativa C"
    direction: DOWN
- assertVisible: "No viable"
- scrollUntilVisible:
    element:
      id: "comparison.simulate"
    direction: DOWN
- assertVisible: "Simular cambios"
