appId: com.anden.app
---
- runFlow:
    file: setup.yaml
- tapOn:
    id: "dashboard.compare"
- extendedWaitUntil:
    visible: "Tu comparación"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Tu plan actual"
    direction: DOWN
- assertVisible: "Tu plan actual"
- scrollUntilVisible:
    element:
      text: "Alternativa B"
    direction: DOWN
- assertVisible: "Alternativa B"
- scrollUntilVisible:
    element:
      text: "Alternativa C"
    direction: DOWN
- assertVisible: "Alternativa C"
- scrollUntilVisible:
    element:
      id: "comparison.simulate"
    direction: DOWN
- assertVisible: "Probar un cambio"
