appId: com.anden.app
---
# Fresh install: complete onboarding (no parcel yet), then load the demo
# parcel from the empty dashboard so all sections (prices, water, plans)
# appear without filling the parcel profile by hand.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "brand.header"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "intro.brand"
    file: intro-skip.yaml
- extendedWaitUntil:
    visible:
      id: "onboarding.language.es-PE"
    timeout: 60000
- runFlow:
    file: onboarding-profile.yaml
- extendedWaitUntil:
    visible: "Bienvenido a Anden"
    timeout: 60000
- assertVisible:
    id: "dashboard.demo"
- tapOn:
    id: "dashboard.demo"
- extendedWaitUntil:
    visible:
      id: "dashboard.hero"
    timeout: 180000
- assertVisible: "Tus precios"
- assertVisible: "Precios"
