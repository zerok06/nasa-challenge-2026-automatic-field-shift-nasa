appId: com.anden.app
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "brand.header"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "onboarding.language.es-PE"
    file: onboarding-profile.yaml
- runFlow:
    when:
      visible:
        id: "parcel.new"
    file: parcel-create.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard.hero"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: "dashboard.hero"
    direction: UP
