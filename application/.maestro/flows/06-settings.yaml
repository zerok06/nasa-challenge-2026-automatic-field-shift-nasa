appId: com.anden.app
---
- runFlow:
    file: setup.yaml
- tapOn:
    id: "nav.settings"
- extendedWaitUntil:
    visible: "Tu perfil"
    timeout: 15000
# The profile section is above language; make sure the selector is on screen.
- scrollUntilVisible:
    element:
      id: "settings.language.es-PE"
    direction: DOWN
# Reset to Spanish first so this flow is repeatable after a previous run.
- tapOn:
    id: "settings.language.es-PE"
- extendedWaitUntil:
    visible: "Ajustes"
    timeout: 15000
- assertVisible: "Idioma"
- tapOn:
    id: "settings.language.en"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
- tapOn:
    id: "settings.language.es-PE"
- extendedWaitUntil:
    visible: "Ajustes"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "nav.back"
    direction: UP
- tapOn:
    id: "nav.back"
- extendedWaitUntil:
    visible:
      id: "dashboard.hero"
    timeout: 15000
