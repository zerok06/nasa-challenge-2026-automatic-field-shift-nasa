appId: host.exp.exponent
---
- launchApp:
    clearState: false
- openLink: "exp://127.0.0.1:8081"
- runFlow:
    when:
      visible: "Go home"
    file: dismiss-devmenu.yaml
- runFlow:
    when:
      visible: "Development servers"
    file: open-project.yaml
- extendedWaitUntil:
    visible:
      id: "brand.header"
    timeout: 60000
