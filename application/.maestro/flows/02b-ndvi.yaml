appId: host.exp.exponent
---
- runFlow:
    file: setup.yaml
- scrollUntilVisible:
    element:
      id: "dashboard.map"
    direction: DOWN
- tapOn:
    id: "dashboard.map"
- extendedWaitUntil:
    visible: "IMERG"
    timeout: 30000
- tapOn:
    id: "map.layer.ndvi"
- extendedWaitUntil:
    visible: "NDVI"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "map.ndvi.dateB"
    direction: DOWN
- tapOn:
    id: "map.ndvi.dateB"
- scrollUntilVisible:
    element:
      text: ".*2024-09-01.*"
    direction: DOWN
- assertVisible: ".*2024-09-01.*"
- scrollUntilVisible:
    element:
      text: ".*No diagnostica nutrientes.*"
    direction: DOWN
- assertVisible: ".*No diagnostica nutrientes.*"
- tapOn:
    id: "nav.home"
