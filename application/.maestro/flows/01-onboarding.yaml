appId: com.anden.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "onboarding.language.es-PE"
    timeout: 60000
- runFlow:
    file: onboarding-profile.yaml
- extendedWaitUntil:
    visible:
      id: "parcel.new"
    timeout: 30000
- runFlow:
    file: parcel-create.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard.hero"
    timeout: 120000
- assertNotVisible: "DEMO"
- assertVisible: "¿Qué necesitas?"
- scrollUntilVisible:
    element:
      text: "Tu parcela"
    direction: DOWN
- assertVisible: "Tu parcela"
