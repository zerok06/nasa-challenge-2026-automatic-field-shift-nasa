appId: host.exp.exponent
---
- launchApp:
    clearState: false
- openLink: "exp://127.0.0.1:8081"
- runFlow:
    when:
      visible: "Go home"
    file: dismiss-devmenu.yaml
- runFlow:
    when:
      visible: "Development servers"
    file: open-project.yaml
- extendedWaitUntil:
    visible:
      id: "brand.header"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "nav.back"
    file: navigate-back.yaml
- runFlow:
    when:
      visible:
        id: "nav.home"
    file: go-home.yaml
- runFlow:
    when:
      visible: "Cargar parcela demo"
    file: onboarding-demo.yaml
- extendedWaitUntil:
    visible: "Ficha de parcela"
    timeout: 30000
- assertVisible: "Parcela demo"
- assertVisible: "Contexto NASA"
