appId: com.anden.app
---
- runFlow:
    file: setup.yaml
- tapOn:
    id: "nav.parcel"
- extendedWaitUntil:
    visible:
      id: "parcel.summary"
    timeout: 30000
- assertVisible: "Datos para decidir"
- scrollUntilVisible:
    element:
      id: "parcel.offline"
    direction: DOWN
- assertVisible: "Datos sin internet"
- tapOn:
    id: "nav.home"
