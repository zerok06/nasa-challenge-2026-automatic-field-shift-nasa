appId: host.exp.exponent
---
- runFlow:
    file: setup.yaml
- tapOn:
    id: "nav.agent"
- extendedWaitUntil:
    visible: "Preguntale al agente"
    timeout: 30000
- tapOn:
    id: "agent.input"
- waitForAnimationToEnd
- inputText: "Compara rotaciones que usen menos agua"
- waitForAnimationToEnd
- tapOn:
    id: "agent.send"
- extendedWaitUntil:
    visible: ".*Preparé la comparación.*"
    timeout: 30000
- tapOn:
    id: "agent.input"
- waitForAnimationToEnd
- inputText: "Guardar un borrador"
- waitForAnimationToEnd
- tapOn:
    id: "agent.send"
- extendedWaitUntil:
    visible: "Borrador listo"
    timeout: 30000
- tapOn:
    id: "agent.save"
- extendedWaitUntil:
    visible: ".*Borrador guardado.*"
    timeout: 30000
