[project]
name = "automatic-api"
version = "0.1.0"
description = "Automatic MVP API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "geoalchemy2>=0.15.0",
  "pyjwt>=2.9.0",
  "httpx>=0.27.0",
  "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
agent = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-groq>=0.2.0",
]
gemini = [
  "google-genai>=2.30.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
