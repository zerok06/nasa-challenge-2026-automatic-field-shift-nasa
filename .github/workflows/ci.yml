name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: automatic
          POSTGRES_USER: automatic
          POSTGRES_PASSWORD: automatic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automatic -d automatic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar uv
        run: pip install uv==0.13.8
      - name: Crear .env de CI
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          API_PORT=8000
          POSTGRES_DB=automatic
          POSTGRES_USER=automatic
          POSTGRES_PASSWORD=automatic
          DATABASE_URL=postgresql+psycopg://automatic:automatic@localhost:5432/automatic
          JWT_SECRET=ci-secret-please-change-32-chars-minimum
          LLM_PROVIDER=fake
          DATASETS_DIR=datasets
          EOF
      - name: Instalar backend
        working-directory: backend
        run: uv sync --extra dev --extra gemini
      - name: Tests backend
        run: backend/.venv/bin/python -m pytest backend/tests -q

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
